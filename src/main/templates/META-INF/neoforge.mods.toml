license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
iconFile="assets/zoomify/icon.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/zoomify-plus-plus"
issueTrackerURL="https://github.com/PatchedPixel/Zoomify-plus-plus/issues"
authors="isxander"
description='A zoom mod with infinite customizability.'

[modproperties.modmenu]
badges=["client"]
links=["Original Project=https://modrinth.com/mod/zoomify"]
contributors=[
    "PatchedPixel"
]
sources="https://github.com/PatchedPixel/Zoomify-plus-plus"

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[26.3.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
