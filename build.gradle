plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = "${mod_id}-${mod_loader}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:DOUdJVEm:9ePC9FQ4"

    def twelveMonkeysVersion = "3.12.0"

    implementation "com.twelvemonkeys.imageio:imageio-core:${twelveMonkeysVersion}"
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}"
    implementation "com.twelvemonkeys.imageio:imageio-metadata:${twelveMonkeysVersion}"

    implementation "com.twelvemonkeys.common:common-lang:${twelveMonkeysVersion}"
    implementation "com.twelvemonkeys.common:common-io:${twelveMonkeysVersion}"
    implementation "com.twelvemonkeys.common:common-image:${twelveMonkeysVersion}"

    jarJar "com.twelvemonkeys.imageio:imageio-core:${twelveMonkeysVersion}"
    jarJar "com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}"
    jarJar "com.twelvemonkeys.imageio:imageio-metadata:${twelveMonkeysVersion}"

    jarJar "com.twelvemonkeys.common:common-lang:${twelveMonkeysVersion}"
    jarJar "com.twelvemonkeys.common:common-io:${twelveMonkeysVersion}"
    jarJar "com.twelvemonkeys.common:common-image:${twelveMonkeysVersion}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
